security:
- hmac: []
tags:
- name: '#X Amz Target=AmazonDMSv20160101.ImportCertificate'
paths:
  /#X-Amz-Target=AmazonDMSv20160101.ImportCertificate:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ImportCertificate
      description: Uploads the specified certificate.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCertificateResponse'
        '480':
          description: ResourceAlreadyExistsFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAlreadyExistsFault'
        '481':
          description: InvalidCertificateFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCertificateFault'
        '482':
          description: ResourceQuotaExceededFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceQuotaExceededFault'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCertificateMessage'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - AmazonDMSv20160101.ImportCertificate
      tags:
      - '#X Amz Target=AmazonDMSv20160101.ImportCertificate'
components:
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  schemas:
    Certificate:
      type: object
      properties:
        CertificateIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: A customer-assigned name for the certificate. Identifiers must begin with a letter and must contain only ASCII letters, digits, and hyphens. They can't end with a hyphen or contain two consecutive hyphens.
        CertificateCreationDate:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The date that the certificate was created.
        CertificatePem:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The contents of a <code>.pem</code> file, which contains an X.509 certificate.
        CertificateWallet:
          allOf:
          - $ref: '#/components/schemas/CertificateWallet'
          - description: 'The location of an imported Oracle Wallet certificate for use with SSL. Example: <code>filebase64("${path.root}/rds-ca-2019-root.sso")</code> '
        CertificateArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Resource Name (ARN) for the certificate.
        CertificateOwner:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The owner of the certificate.
        ValidFromDate:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The beginning date that the certificate is valid.
        ValidToDate:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The final date that the certificate is valid.
        SigningAlgorithm:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The signing algorithm for the certificate.
        KeyLength:
          allOf:
          - $ref: '#/components/schemas/IntegerOptional'
          - description: The key length of the cryptographic algorithm being used.
      description: The SSL certificate that can be used to encrypt connections between the endpoints and the replication instance.
    ImportCertificateResponse:
      type: object
      example:
        Certificate: {}
      properties:
        Certificate:
          allOf:
          - $ref: '#/components/schemas/Certificate'
          - description: The certificate to be uploaded.
    IntegerOptional:
      type: integer
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
    Tag:
      type: object
      properties:
        Key:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: 'A key is the required name of the tag. The string value can be 1-128 Unicode characters in length and can''t be prefixed with "aws:" or "dms:". The string can only contain only the set of Unicode letters, digits, white-space, ''_'', ''.'', ''/'', ''='', ''+'', ''-'' (Java regular expressions: "^([\\p{L}\\p{Z}\\p{N}_.:/=+\\-]*)$").'
        Value:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: 'A value is the optional value of the tag. The string value can be 1-256 Unicode characters in length and can''t be prefixed with "aws:" or "dms:". The string can only contain only the set of Unicode letters, digits, white-space, ''_'', ''.'', ''/'', ''='', ''+'', ''-'' (Java regular expressions: "^([\\p{L}\\p{Z}\\p{N}_.:/=+\\-]*)$").'
        ResourceArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Resource Name (ARN) string that uniquely identifies the resource for which the tag is created.
      description: <p>A user-defined key-value pair that describes metadata added to an DMS resource and that is used by operations such as the following:</p> <ul> <li> <p> <code>AddTagsToResource</code> </p> </li> <li> <p> <code>ListTagsForResource</code> </p> </li> <li> <p> <code>RemoveTagsFromResource</code> </p> </li> </ul>
    TStamp:
      type: string
      format: date-time
    InvalidCertificateFault: {}
    String:
      type: string
    ResourceAlreadyExistsFault: {}
    CertificateWallet:
      type: string
    SecretString:
      type: string
      format: password
    ResourceQuotaExceededFault: {}
    ImportCertificateMessage:
      type: object
      required:
      - CertificateIdentifier
      title: ImportCertificateMessage
      properties:
        CertificateIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: A customer-assigned name for the certificate. Identifiers must begin with a letter and must contain only ASCII letters, digits, and hyphens. They can't end with a hyphen or contain two consecutive hyphens.
        CertificatePem:
          allOf:
          - $ref: '#/components/schemas/SecretString'
          - description: The contents of a <code>.pem</code> file, which contains an X.509 certificate.
        CertificateWallet:
          allOf:
          - $ref: '#/components/schemas/CertificateWallet'
          - description: '<p>The location of an imported Oracle Wallet certificate for use with SSL. Provide the name of a <code>.sso</code> file using the <code>fileb://</code> prefix. You can''t provide the certificate inline.</p> <p>Example: <code>filebase64("${path.root}/rds-ca-2019-root.sso")</code> </p>'
        Tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: The tags associated with the certificate.
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
