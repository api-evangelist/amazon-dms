paths:
  /#X-Amz-Target=AmazonDMSv20160101.ReloadTables:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ReloadTables
      description: <p>Reloads the target database table with the source data. </p> <p>You can only use this operation with a task in the <code>RUNNING</code> state, otherwise the service will throw an <code>InvalidResourceStateFault</code> exception.</p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadTablesResponse'
        '480':
          description: ResourceNotFoundFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundFault'
        '481':
          description: InvalidResourceStateFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidResourceStateFault'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadTablesMessage'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - AmazonDMSv20160101.ReloadTables
      tags:
      - '#X Amz Target=AmazonDMSv20160101.ReloadTables'
components:
  schemas:
    InvalidResourceStateFault: {}
    ReloadTablesResponse:
      type: object
      properties:
        ReplicationTaskArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: 'The Amazon Resource Name (ARN) of the replication task. '
    String:
      type: string
    TableListToReload:
      type: array
      items:
        $ref: '#/components/schemas/TableToReload'
    TableToReload:
      type: object
      required:
      - SchemaName
      - TableName
      properties:
        SchemaName:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The schema name of the table to be reloaded.
        TableName:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The table name of the table to be reloaded.
      description: Provides the name of the schema and table to be reloaded.
    ReloadTablesMessage:
      type: object
      required:
      - ReplicationTaskArn
      - TablesToReload
      title: ReloadTablesMessage
      properties:
        ReplicationTaskArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: 'The Amazon Resource Name (ARN) of the replication task. '
        TablesToReload:
          allOf:
          - $ref: '#/components/schemas/TableListToReload'
          - description: 'The name and schema of the table to be reloaded. '
        ReloadOption:
          allOf:
          - $ref: '#/components/schemas/ReloadOptionValue'
          - description: '<p>Options for reload. Specify <code>data-reload</code> to reload the data and re-validate it if validation is enabled. Specify <code>validate-only</code> to re-validate the table. This option applies only when validation is enabled for the task. </p> <p>Valid values: data-reload, validate-only</p> <p>Default value is data-reload.</p>'
    ReloadOptionValue:
      type: string
      enum:
      - data-reload
      - validate-only
    ResourceNotFoundFault: {}
