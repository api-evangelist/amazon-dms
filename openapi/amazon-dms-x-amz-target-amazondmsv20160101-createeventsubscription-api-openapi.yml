        $ref: '#/components/schemas/String'
    KMSAccessDeniedFault: {}
    String:
      type: string
    Boolean:
      type: boolean
    KMSDisabledFault: {}
    KMSNotFoundFault: {}
    ResourceNotFoundFault: {}
    ResourceAlreadyExistsFault: {}
