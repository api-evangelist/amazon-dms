components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
  schemas:
    KMSInvalidStateFault: {}
    KMSKeyNotAccessibleFault: {}
    S3ResourceNotFoundFault: {}
    StartReplicationTaskAssessmentRunMessage:
      type: object
      required:
      - ReplicationTaskArn
      - ServiceAccessRoleArn
      - ResultLocationBucket
      - AssessmentRunName
      title: StartReplicationTaskAssessmentRunMessage
      properties:
        ReplicationTaskArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Amazon Resource Name (ARN) of the migration task associated with the premigration assessment run that you want to start.
        ServiceAccessRoleArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ARN of the service role needed to start the assessment run. The role must allow the <code>iam:PassRole</code> action.
        ResultLocationBucket:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Amazon S3 bucket where you want DMS to store the results of this assessment run.
        ResultLocationFolder:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Folder within an Amazon S3 bucket where you want DMS to store the results of this assessment run.
        ResultEncryptionMode:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>Encryption mode that you can specify to encrypt the results of this assessment run. If you don't specify this request parameter, DMS stores the assessment run results without encryption. You can specify one of the options following:</p> <ul> <li> <p> <code>"SSE_S3"</code> – The server-side encryption provided as a default by Amazon S3.</p> </li> <li> <p> <code>"SSE_KMS"</code> – Key Management Service (KMS) encryption. This encryption can use either a custom KMS encryption key that you specify or the default KMS encryption key that DMS provides.</p> </li> </ul>
        ResultKmsKeyArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ARN of a custom KMS encryption key that you specify when you set <code>ResultEncryptionMode</code> to <code>"SSE_KMS</code>".
        AssessmentRunName:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Unique name to identify the assessment run.
        IncludeOnly:
          allOf:
          - $ref: '#/components/schemas/IncludeTestList'
          - description: <p>Space-separated list of names for specific individual assessments that you want to include. These names come from the default list of individual assessments that DMS supports for the associated migration task. This task is specified by <code>ReplicationTaskArn</code>.</p> <note> <p>You can't set a value for <code>IncludeOnly</code> if you also set a value for <code>Exclude</code> in the API operation. </p> <p>To identify the names of the default individual assessments that DMS supports for the associated migration task, run the <code>DescribeApplicableIndividualAssessments</code> operation using its own <code>ReplicationTaskArn</code> request parameter.</p> </note>
        Exclude:
          allOf:
          - $ref: '#/components/schemas/ExcludeTestList'
          - description: <p>Space-separated list of names for specific individual assessments that you want to exclude. These names come from the default list of individual assessments that DMS supports for the associated migration task. This task is specified by <code>ReplicationTaskArn</code>.</p> <note> <p>You can't set a value for <code>Exclude</code> if you also set a value for <code>IncludeOnly</code> in the API operation.</p> <p>To identify the names of the default individual assessments that DMS supports for the associated migration task, run the <code>DescribeApplicableIndividualAssessments</code> operation using its own <code>ReplicationTaskArn</code> request parameter.</p> </note>
      description: <p/>
    S3AccessDeniedFault: {}
    TStamp:
      type: string
      format: date-time
    Integer:
      type: integer
    IncludeTestList:
      type: array
      items:
        $ref: '#/components/schemas/String'
    InvalidResourceStateFault: {}
    AccessDeniedFault: {}
    KMSAccessDeniedFault: {}
    String:
      type: string
    StartReplicationTaskAssessmentRunResponse:
      type: object
      properties:
        ReplicationTaskAssessmentRun:
          allOf:
          - $ref: '#/components/schemas/ReplicationTaskAssessmentRun'
          - description: The premigration assessment run that was started.
      description: <p/>
    KMSDisabledFault: {}
    ReplicationTaskAssessmentRunProgress:
      type: object
      properties:
        IndividualAssessmentCount:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: The number of individual assessments that are specified to run.
        IndividualAssessmentCompletedCount:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: The number of individual assessments that have completed, successfully or not.
      description: The progress values reported by the <code>AssessmentProgress</code> response element.
    KMSNotFoundFault: {}
    ExcludeTestList:
      type: array
      items:
        $ref: '#/components/schemas/String'
    ResourceNotFoundFault: {}
    ResourceAlreadyExistsFault: {}
    KMSFault: {}
    ReplicationTaskAssessmentRun:
      type: object
      properties:
        ReplicationTaskAssessmentRunArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Amazon Resource Name (ARN) of this assessment run.
        ReplicationTaskArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ARN of the migration task associated with this premigration assessment run.
        Status:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>Assessment run status. </p> <p>This status can have one of the following values:</p> <ul> <li> <p> <code>"cancelling"</code> – The assessment run was canceled by the <code>CancelReplicationTaskAssessmentRun</code> operation.</p> </li> <li> <p> <code>"deleting"</code> – The assessment run was deleted by the <code>DeleteReplicationTaskAssessmentRun</code> operation.</p> </li> <li> <p> <code>"failed"</code> – At least one individual assessment completed with a <code>failed</code> status.</p> </li> <li> <p> <code>"error-provisioning"</code> – An internal error occurred while resources were provisioned (during <code>provisioning</code> status).</p> </li> <li> <p> <code>"error-executing"</code> – An internal error occurred while individual assessments ran (during <code>running</code> status).</p> </li> <li> <p> <code>"invalid state"</code> – The assessment run is in an unknown state.</p> </li> <li> <p> <code>"passed"</code> – All individual assessments have completed, and none has a <code>failed</code> status.</p> </li> <li> <p> <code>"provisioning"</code> – Resources required to run individual assessments are being provisioned.</p> </li> <li> <p> <code>"running"</code> – Individual assessments are being run.</p> </li> <li> <p> <code>"starting"</code> – The assessment run is starting, but resources are not yet being provisioned for individual assessments.</p> </li> </ul>
        ReplicationTaskAssessmentRunCreationDate:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: Date on which the assessment run was created using the <code>StartReplicationTaskAssessmentRun</code> operation.
        AssessmentProgress:
          allOf:
          - $ref: '#/components/schemas/ReplicationTaskAssessmentRunProgress'
          - description: Indication of the completion progress for the individual assessments specified to run.
        LastFailureMessage:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Last message generated by an individual assessment failure.
        ServiceAccessRoleArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ARN of the service role used to start the assessment run using the <code>StartReplicationTaskAssessmentRun</code> operation. The role must allow the <code>iam:PassRole</code> action.
        ResultLocationBucket:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Amazon S3 bucket where DMS stores the results of this assessment run.
        ResultLocationFolder:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Folder in an Amazon S3 bucket where DMS stores the results of this assessment run.
        ResultEncryptionMode:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Encryption mode used to encrypt the assessment run results.
        ResultKmsKeyArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ARN of the KMS encryption key used to encrypt the assessment run results.
        AssessmentRunName:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Unique name of the assessment run.
      description: <p>Provides information that describes a premigration assessment run that you have started using the <code>StartReplicationTaskAssessmentRun</code> operation.</p> <p>Some of the information appears based on other operations that can return the <code>ReplicationTaskAssessmentRun</code> object.</p>
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
