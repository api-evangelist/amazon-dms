        in: header
        required: true
        schema:
          type: string
          enum:
          - AmazonDMSv20160101.ApplyPendingMaintenanceAction
      tags:
      - '#X Amz Target=AmazonDMSv20160101.ApplyPendingMaintenanceAction'
components:
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
  schemas:
    PendingMaintenanceActionDetails:
      type: array
      items:
        $ref: '#/components/schemas/PendingMaintenanceAction'
    PendingMaintenanceAction:
      type: object
      properties:
        Action:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The type of pending maintenance action that is available for the resource.
        AutoAppliedAfterDate:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The date of the maintenance window when the action is to be applied. The maintenance action is applied to the resource during its first maintenance window after this date. If this date is specified, any <code>next-maintenance</code> opt-in requests are ignored.
        ForcedApplyDate:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The date when the maintenance action will be automatically applied. The maintenance action is applied to the resource on this date regardless of the maintenance window for the resource. If this date is specified, any <code>immediate</code> opt-in requests are ignored.
        OptInStatus:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The type of opt-in request that has been received for the resource.
        CurrentApplyDate:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The effective date when the pending maintenance action will be applied to the resource. This date takes into account opt-in requests received from the <code>ApplyPendingMaintenanceAction</code> API operation, and also the <code>AutoAppliedAfterDate</code> and <code>ForcedApplyDate</code> parameter values. This value is blank if an opt-in request has not been received and nothing has been specified for <code>AutoAppliedAfterDate</code> or <code>ForcedApplyDate</code>.
        Description:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: A description providing more detail about the maintenance action.
      description: Describes a maintenance action pending for an DMS resource, including when and how it will be applied. This data type is a response element to the <code>DescribePendingMaintenanceActions</code> operation.
    String:
      type: string
    ResourcePendingMaintenanceActions:
      type: object
      properties:
        ResourceIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Resource Name (ARN) of the DMS resource that the pending maintenance action applies to. For information about creating an ARN, see <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Introduction.AWS.ARN.html"> Constructing an Amazon Resource Name (ARN) for DMS</a> in the DMS documentation.
        PendingMaintenanceActionDetails:
          allOf:
          - $ref: '#/components/schemas/PendingMaintenanceActionDetails'
          - description: Detailed information about the pending maintenance action.
      description: Identifies an DMS resource and any pending actions for it.
    TStamp:
      type: string
      format: date-time
    ApplyPendingMaintenanceActionMessage:
      type: object
      required:
      - ReplicationInstanceArn
      - ApplyAction
      - OptInType
      title: ApplyPendingMaintenanceActionMessage
      properties:
        ReplicationInstanceArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Resource Name (ARN) of the DMS resource that the pending maintenance action applies to.
        ApplyAction:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: '<p>The pending maintenance action to apply to this resource.</p> <p>Valid values: <code>os-upgrade</code>, <code>system-update</code>, <code>db-upgrade</code> </p>'
        OptInType:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>A value that specifies the type of opt-in request, or undoes an opt-in request. You can't undo an opt-in request of type <code>immediate</code>.</p> <p>Valid values:</p> <ul> <li> <p> <code>immediate</code> - Apply the maintenance action immediately.</p> </li> <li> <p> <code>next-maintenance</code> - Apply the maintenance action during the next maintenance window for the resource.</p> </li> <li> <p> <code>undo-opt-in</code> - Cancel any existing <code>next-maintenance</code> opt-in requests.</p> </li> </ul>
      description: <p/>
    ResourceNotFoundFault: {}
    ApplyPendingMaintenanceActionResponse:
      type: object
      properties:
        ResourcePendingMaintenanceActions:
          allOf:
          - $ref: '#/components/schemas/ResourcePendingMaintenanceActions'
          - description: The DMS resource that the pending maintenance action will be applied to.
      description: <p/>
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
