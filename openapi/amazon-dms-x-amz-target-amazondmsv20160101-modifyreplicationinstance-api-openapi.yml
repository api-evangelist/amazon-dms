    post:
      operationId: ModifyReplicationInstance
      description: <p>Modifies the replication instance to apply new settings. You can change one or more parameters by specifying these parameters and the new values in the request.</p> <p>Some settings are applied during the maintenance window.</p> <p/>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyReplicationInstanceResponse'
        '480':
          description: AccessDeniedFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedFault'
        '481':
          description: InvalidResourceStateFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidResourceStateFault'
        '482':
          description: ResourceAlreadyExistsFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAlreadyExistsFault'
        '483':
          description: ResourceNotFoundFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundFault'
        '484':
          description: InsufficientResourceCapacityFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientResourceCapacityFault'
        '485':
          description: StorageQuotaExceededFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageQuotaExceededFault'
        '486':
          description: UpgradeDependencyFailureFault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeDependencyFailureFault'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyReplicationInstanceMessage'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - AmazonDMSv20160101.ModifyReplicationInstance
      tags:
      - '#X Amz Target=AmazonDMSv20160101.ModifyReplicationInstance'
components:
  schemas:
    AvailabilityZone:
      type: object
      properties:
        Name:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The name of the Availability Zone.
      description: The name of an Availability Zone for use during database migration. <code>AvailabilityZone</code> is an optional parameter to the <a href="https://docs.aws.amazon.com/dms/latest/APIReference/API_CreateReplicationInstance.html"> <code>CreateReplicationInstance</code> </a> operation, and it’s value relates to the Amazon Web Services Region of an endpoint. For example, the availability zone of an endpoint in the us-east-1 region might be us-east-1a, us-east-1b, us-east-1c, or us-east-1d.
    InsufficientResourceCapacityFault: {}
    UpgradeDependencyFailureFault: {}
    BooleanOptional:
      type: boolean
    StringList:
      type: array
      items:
        $ref: '#/components/schemas/String'
    Subnet:
      type: object
      properties:
        SubnetIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The subnet identifier.
        SubnetAvailabilityZone:
          allOf:
          - $ref: '#/components/schemas/AvailabilityZone'
          - description: The Availability Zone of the subnet.
        SubnetStatus:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The status of the subnet.
      description: In response to a request by the <code>DescribeReplicationSubnetGroups</code> operation, this object identifies a subnet by its given Availability Zone, subnet identifier, and status.
    ReplicationPendingModifiedValues:
      type: object
      properties:
        ReplicationInstanceClass:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>The compute and memory capacity of the replication instance as defined for the specified replication instance class.</p> <p>For more information on the settings and capacities for the available replication instance classes, see <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_ReplicationInstance.html#CHAP_ReplicationInstance.InDepth"> Selecting the right DMS replication instance for your migration</a>. </p>
        AllocatedStorage:
          allOf:
          - $ref: '#/components/schemas/IntegerOptional'
          - description: The amount of storage (in gigabytes) that is allocated for the replication instance.
        MultiAZ:
          allOf:
          - $ref: '#/components/schemas/BooleanOptional'
          - description: ' Specifies whether the replication instance is a Multi-AZ deployment. You can''t set the <code>AvailabilityZone</code> parameter if the Multi-AZ parameter is set to <code>true</code>. '
        EngineVersion:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The engine version number of the replication instance.
        NetworkType:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The type of IP address protocol used by a replication instance, such as IPv4 only or Dual-stack that supports both IPv4 and IPv6 addressing. IPv6 only is not yet supported.
      description: 'Provides information about the values of pending modifications to a replication instance. This data type is an object of the <a href="https://docs.aws.amazon.com/dms/latest/APIReference/API_ReplicationInstance.html"> <code>ReplicationInstance</code> </a> user-defined data type. '
    ReplicationInstanceIpv6AddressList:
      type: array
      items:
        $ref: '#/components/schemas/String'
    TStamp:
      type: string
      format: date-time
    SubnetList:
      type: array
      items:
        $ref: '#/components/schemas/Subnet'
    ReplicationInstance:
      type: object
      properties:
        ReplicationInstanceIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: '<p>The replication instance identifier is a required parameter. This parameter is stored as a lowercase string.</p> <p>Constraints:</p> <ul> <li> <p>Must contain 1-63 alphanumeric characters or hyphens.</p> </li> <li> <p>First character must be a letter.</p> </li> <li> <p>Cannot end with a hyphen or contain two consecutive hyphens.</p> </li> </ul> <p>Example: <code>myrepinstance</code> </p>'
        ReplicationInstanceClass:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>The compute and memory capacity of the replication instance as defined for the specified replication instance class. It is a required parameter, although a default value is pre-selected in the DMS console.</p> <p>For more information on the settings and capacities for the available replication instance classes, see <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_ReplicationInstance.html#CHAP_ReplicationInstance.InDepth"> Selecting the right DMS replication instance for your migration</a>. </p>
        ReplicationInstanceStatus:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>The status of the replication instance. The possible return values include:</p> <ul> <li> <p> <code>"available"</code> </p> </li> <li> <p> <code>"creating"</code> </p> </li> <li> <p> <code>"deleted"</code> </p> </li> <li> <p> <code>"deleting"</code> </p> </li> <li> <p> <code>"failed"</code> </p> </li> <li> <p> <code>"modifying"</code> </p> </li> <li> <p> <code>"upgrading"</code> </p> </li> <li> <p> <code>"rebooting"</code> </p> </li> <li> <p> <code>"resetting-master-credentials"</code> </p> </li> <li> <p> <code>"storage-full"</code> </p> </li> <li> <p> <code>"incompatible-credentials"</code> </p> </li> <li> <p> <code>"incompatible-network"</code> </p> </li> <li> <p> <code>"maintenance"</code> </p> </li> </ul>
        AllocatedStorage:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: The amount of storage (in gigabytes) that is allocated for the replication instance.
        InstanceCreateTime:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The time the replication instance was created.
        VpcSecurityGroups:
          allOf:
          - $ref: '#/components/schemas/VpcSecurityGroupMembershipList'
          - description: The VPC security group for the instance.
        AvailabilityZone:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Availability Zone for the instance.
        ReplicationSubnetGroup:
          allOf:
          - $ref: '#/components/schemas/ReplicationSubnetGroup'
          - description: The subnet group for the replication instance.
        PreferredMaintenanceWindow:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The maintenance window times for the replication instance. Any pending upgrades to the replication instance are performed during this time.
        PendingModifiedValues:
          allOf:
          - $ref: '#/components/schemas/ReplicationPendingModifiedValues'
          - description: The pending modification values.
        MultiAZ:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: ' Specifies whether the replication instance is a Multi-AZ deployment. You can''t set the <code>AvailabilityZone</code> parameter if the Multi-AZ parameter is set to <code>true</code>. '
        EngineVersion:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>The engine version number of the replication instance.</p> <p>If an engine version number is not specified when a replication instance is created, the default is the latest engine version available.</p> <p>When modifying a major engine version of an instance, also set <code>AllowMajorVersionUpgrade</code> to <code>true</code>.</p>
        AutoMinorVersionUpgrade:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: Boolean value indicating if minor version upgrades will be automatically applied to the instance.
        KmsKeyId:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>An KMS key identifier that is used to encrypt the data on the replication instance.</p> <p>If you don't specify a value for the <code>KmsKeyId</code> parameter, then DMS uses your default encryption key.</p> <p>KMS creates the default encryption key for your Amazon Web Services account. Your Amazon Web Services account has a different default encryption key for each Amazon Web Services Region.</p>
        ReplicationInstanceArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Resource Name (ARN) of the replication instance.
        ReplicationInstancePublicIpAddress:
          allOf:
          - $ref: '#/components/schemas/String'
          - deprecated: true
            description: The public IP address of the replication instance.
        ReplicationInstancePrivateIpAddress:
          allOf:
          - $ref: '#/components/schemas/String'
          - deprecated: true
            description: The private IP address of the replication instance.
        ReplicationInstancePublicIpAddresses:
          allOf:
          - $ref: '#/components/schemas/ReplicationInstancePublicIpAddressList'
          - description: One or more public IP addresses for the replication instance.
        ReplicationInstancePrivateIpAddresses:
          allOf:
          - $ref: '#/components/schemas/ReplicationInstancePrivateIpAddressList'
          - description: One or more private IP addresses for the replication instance.
        ReplicationInstanceIpv6Addresses:
          allOf:
          - $ref: '#/components/schemas/ReplicationInstanceIpv6AddressList'
          - description: One or more IPv6 addresses for the replication instance.
        PubliclyAccessible:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: ' Specifies the accessibility options for the replication instance. A value of <code>true</code> represents an instance with a public IP address. A value of <code>false</code> represents an instance with a private IP address. The default value is <code>true</code>. '
        SecondaryAvailabilityZone:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Availability Zone of the standby replication instance in a Multi-AZ deployment.
        FreeUntil:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: ' The expiration date of the free replication instance that is part of the Free DMS program. '
        DnsNameServers:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The DNS name servers supported for the replication instance to access your on-premise source or target database.
        NetworkType:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The type of IP address protocol used by a replication instance, such as IPv4 only or Dual-stack that supports both IPv4 and IPv6 addressing. IPv6 only is not yet supported.
      description: Provides information that defines a replication instance.
    Integer:
      type: integer
    InvalidResourceStateFault: {}
    ReplicationInstancePublicIpAddressList:
      type: array
      items:
        $ref: '#/components/schemas/String'
    ModifyReplicationInstanceResponse:
      type: object
      example:
        ReplicationInstance:
          AllocatedStorage: 5
          AutoMinorVersionUpgrade: true
          EngineVersion: 1.5.0
          KmsKeyId: arn:aws:kms:us-east-1:123456789012:key/4c1731d6-5435-ed4d-be13-d53411a7cfbd
          PendingModifiedValues: {}
          PreferredMaintenanceWindow: sun:06:00-sun:14:00
          PubliclyAccessible: true
          ReplicationInstanceArn: arn:aws:dms:us-east-1:123456789012:rep:6UTDJGBOUS3VI3SUWA66XFJCJQ
          ReplicationInstanceClass: dms.t2.micro
          ReplicationInstanceIdentifier: test-rep-1
          ReplicationInstanceStatus: available
          ReplicationSubnetGroup:
            ReplicationSubnetGroupDescription: default
            ReplicationSubnetGroupIdentifier: default
            SubnetGroupStatus: Complete
            Subnets:
            - SubnetAvailabilityZone:
                Name: us-east-1d
              SubnetIdentifier: subnet-f6dd91af
              SubnetStatus: Active
            - SubnetAvailabilityZone:
                Name: us-east-1b
              SubnetIdentifier: subnet-3605751d
              SubnetStatus: Active
            - SubnetAvailabilityZone:
                Name: us-east-1c
              SubnetIdentifier: subnet-c2daefb5
              SubnetStatus: Active
            - SubnetAvailabilityZone:
                Name: us-east-1e
              SubnetIdentifier: subnet-85e90cb8
              SubnetStatus: Active
            VpcId: vpc-6741a603
      properties:
        ReplicationInstance:
          allOf:
          - $ref: '#/components/schemas/ReplicationInstance'
          - description: The modified replication instance.
      description: <p/>
    VpcSecurityGroupMembership:
      type: object
      properties:
        VpcSecurityGroupId:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The VPC security group ID.
        Status:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The status of the VPC security group.
      description: Describes the status of a security group associated with the virtual private cloud (VPC) hosting your replication and DB instances.
    AccessDeniedFault: {}
    VpcSecurityGroupIdList:
      type: array
      items:
        $ref: '#/components/schemas/String'
    IntegerOptional:
      type: integer
    String:
      type: string
    Boolean:
      type: boolean
    ModifyReplicationInstanceMessage:
      type: object
      required:
      - ReplicationInstanceArn
      title: ModifyReplicationInstanceMessage
      properties:
        ReplicationInstanceArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Resource Name (ARN) of the replication instance.
        AllocatedStorage:
          allOf:
          - $ref: '#/components/schemas/IntegerOptional'
          - description: The amount of storage (in gigabytes) to be allocated for the replication instance.
        ApplyImmediately:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: Indicates whether the changes should be applied immediately or during the next maintenance window.
        ReplicationInstanceClass:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>The compute and memory capacity of the replication instance as defined for the specified replication instance class. For example to specify the instance class dms.c4.large, set this parameter to <code>"dms.c4.large"</code>.</p> <p>For more information on the settings and capacities for the available replication instance classes, see <a href="https://docs.aws.amazon.com/dms/latest/userguide/CHAP_ReplicationInstance.html#CHAP_ReplicationInstance.InDepth"> Selecting the right DMS replication instance for your migration</a>. </p>
        VpcSecurityGroupIds:
          allOf:
          - $ref: '#/components/schemas/VpcSecurityGroupIdList'
          - description: ' Specifies the VPC security group to be used with the replication instance. The VPC security group must work with the VPC containing the replication instance. '
        PreferredMaintenanceWindow:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: '<p>The weekly time range (in UTC) during which system maintenance can occur, which might result in an outage. Changing this parameter does not result in an outage, except in the following situation, and the change is asynchronously applied as soon as possible. If moving this window to the current time, there must be at least 30 minutes between the current time and end of the window to ensure pending changes are applied.</p> <p>Default: Uses existing setting</p> <p>Format: ddd:hh24:mi-ddd:hh24:mi</p> <p>Valid Days: Mon | Tue | Wed | Thu | Fri | Sat | Sun</p> <p>Constraints: Must be at least 30 minutes</p>'
        MultiAZ:
          allOf:
          - $ref: '#/components/schemas/BooleanOptional'
          - description: ' Specifies whether the replication instance is a Multi-AZ deployment. You can''t set the <code>AvailabilityZone</code> parameter if the Multi-AZ parameter is set to <code>true</code>. '
        EngineVersion:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>The engine version number of the replication instance.</p> <p>When modifying a major engine version of an instance, also set <code>AllowMajorVersionUpgrade</code> to <code>true</code>.</p>
        AllowMajorVersionUpgrade:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: <p>Indicates that major version upgrades are allowed. Changing this parameter does not result in an outage, and the change is asynchronously applied as soon as possible.</p> <p>This parameter must be set to <code>true</code> when specifying a value for the <code>EngineVersion</code> parameter that is a different major version than the replication instance's current version.</p>
        AutoMinorVersionUpgrade:
          allOf:
          - $ref: '#/components/schemas/BooleanOptional'
          - description: '<p>A value that indicates that minor version upgrades are applied automatically to the replication instance during the maintenance window. Changing this parameter doesn''t result in an outage, except in the case described following. The change is asynchronously applied as soon as possible. </p> <p>An outage does result if these factors apply: </p> <ul> <li> <p>This parameter is set to <code>true</code> during the maintenance window.</p> </li> <li> <p>A newer minor version is available. </p> </li> <li> <p>DMS has enabled automatic patching for the given engine version. </p> </li> </ul> <p>When <code>AutoMinorVersionUpgrade</code> is enabled, DMS uses the current default engine version when you modify a replication instance. For example, if you set <code>EngineVersion</code> to a lower version number than the current default version, DMS uses the default version.</p> <p>If <code>AutoMinorVersionUpgrade</code> <i>isn’t</i> enabled when you modify a replication instance, DMS uses the engine version specified by the <code>EngineVersion</code> parameter.</p>'
        ReplicationInstanceIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The replication instance identifier. This parameter is stored as a lowercase string.
        NetworkType:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The type of IP address protocol used by a replication instance, such as IPv4 only or Dual-stack that supports both IPv4 and IPv6 addressing. IPv6 only is not yet supported.
      description: <p/>
    StorageQuotaExceededFault: {}
    VpcSecurityGroupMembershipList:
      type: array
      items:
        $ref: '#/components/schemas/VpcSecurityGroupMembership'
    ReplicationInstancePrivateIpAddressList:
      type: array
      items:
        $ref: '#/components/schemas/String'
    ResourceNotFoundFault: {}
    ResourceAlreadyExistsFault: {}
    ReplicationSubnetGroup:
      type: object
      properties:
        ReplicationSubnetGroupIdentifier:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The identifier of the replication instance subnet group.
        ReplicationSubnetGroupDescription:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: A description for the replication subnet group.
        VpcId:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The ID of the VPC.
        SubnetGroupStatus:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The status of the subnet group.
        Subnets:
          allOf:
          - $ref: '#/components/schemas/SubnetList'
          - description: The subnets that are in the subnet group.
        SupportedNetworkTypes:
          allOf:
          - $ref: '#/components/schemas/StringList'
          - description: The IP addressing protocol supported by the subnet group. This is used by a replication instance with values such as IPv4 only or Dual-stack that supports both IPv4 and IPv6 addressing. IPv6 only is not yet supported.
      description: Describes a subnet group in response to a request by the <code>DescribeReplicationSubnetGroups</code> operation.
